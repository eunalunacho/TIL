name: Update top posts

on:
  schedule:
    - cron: "0 15 * * *" # 매일 00:00 KST
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write # Workload Identity Federation (JSON 키 없이 서비스 계정 인증)

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install google-analytics-data pyyaml

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Fetch top posts from GA4
        env:
          GA_PROPERTY_ID: ${{ vars.GA_PROPERTY_ID }}
        run: python scripts/fetch_top_posts.py

      - name: Commit if changed
        id: commit
        run: |
          if git diff --quiet _data/top_posts.yml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/top_posts.yml
          git commit -m "chore: top posts 갱신"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # GITHUB_TOKEN으로 push하면 Pages 빌드가 자동으로 돌지 않아 직접 요청합니다.
      - name: Rebuild GitHub Pages
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
